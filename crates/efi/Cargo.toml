[package]
name = "bootlogo-forge-efi"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "bootlogo-forge-efi"
path = "src/main.rs"

[dependencies]
bootlogo-forge-core = { path = "../core", default-features = false }

[target.'cfg(target_os = "uefi")'.dependencies]
uefi = { version = "0.41", default-features = false, features = ["alloc", "global_allocator", "panic_handler"] }
