[package]
name = "bootlogo-forge-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["std", "image"]
std = []
image = ["dep:image"]

[lib]
doctest = false

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"], optional = true }

[dev-dependencies]
tempfile = "3"
