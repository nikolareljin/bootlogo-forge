  <text x="520" y="150" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="74" font-weight="800">bootlogo-forge</text>
  <text x="520" y="205" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="30">Replace the boot logo via ACPI BGRT</text>
