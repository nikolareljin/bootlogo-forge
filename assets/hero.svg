<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="bootlogo-forge">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset=".6" stop-color="#111827"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  <symbol id="logomark" viewBox="0 0 128 128">
<defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <clipPath id="screen">
      <rect x="28" y="30" width="72" height="46" rx="8"/>
    </clipPath>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="#0f172a"/>
  <rect x="28" y="30" width="72" height="46" rx="8" fill="#1e293b" stroke="url(#g)" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <path d="M28 72 L48 48 L62 64 L74 40 L100 72 Z" fill="#334155"/>
    <path d="M28 72 L48 48 L62 64 L74 40 L100 72 Z" fill="none" stroke="#22c55e" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="82" cy="44" r="5" fill="#f59e0b"/>
  </g>
  <path d="M46 94 h36" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <path d="M58 84 L64 76 L70 84" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>
</defs>
  <rect width="1280" height="420" fill="url(#bg)"/>
  <g opacity=".08" stroke="#cbd5e1">
    <path d="M0 330h1280M0 290h1280M0 250h1280"/>
  </g>
  <g transform="translate(72,140) scale(0.9)" filter="url(#glow)">
    <use href="#logomark" xlink:href="#logomark" width="128" height="128"/>
  </g>
  <g transform="translate(118,318)">
    <rect width="276" height="34" rx="9" fill="#1e293b"/>
    <circle cx="20" cy="17" r="5" fill="#22c55e"/>
    <text x="38" y="22" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="12">EFI - ACPI BGRT - your image</text>
  </g>
  <text x="500" y="150" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="72" font-weight="800" letter-spacing="-.03em">bootlogo-forge</text>
  <text x="502" y="198" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="26" font-weight="500">Show your own image</text>
  <text x="502" y="228" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="26" font-weight="500">from early boot</text>
  <text x="502" y="272" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="18">ACPI BGRT on UEFI.</text>
  <text x="502" y="298" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="18">Vendor detection selects the backend.</text>
  <text x="502" y="324" fill="#64748b" font-family="system-ui, sans-serif" font-size="16">Linux installer. Dry run by default.</text>
  <rect x="502" y="340" width="180" height="4" rx="2" fill="#6366f1"/>
  <rect x="690" y="340" width="110" height="4" rx="2" fill="#334155"/>
</svg>
