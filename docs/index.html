<img class="hero" src="../assets/hero.svg" alt="bootlogo-forge">
<h1>bootlogo-forge</h1>
<p>Replace the boot logo after POST with your own image on EFI systems using ACPI BGRT.</p>
<pre>bootlogo-forge detect
sudo bootlogo-forge install --image ./logo.png --plymouth --apply
sudo bootlogo-forge uninstall --apply</pre>
<p>See the <a href="https://github.com/nikolareljin/bootlogo-forge">repository</a> for build and safety details.</p>
</main>
